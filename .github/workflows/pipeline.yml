name: Simple Docker CI/CD

on:
  push:
    branches: [main]

jobs:
  ci-cd-job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Get code from GitHub
        uses: actions/checkout@v4

      - name: 2. Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/simple-cicd:latest .

      - name: 3. Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/simple-cicd:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: 4. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/simple-cicd:latest

      - name: 6. Create and verify container
        run: |
          docker run -d --name my-web-container -p 8080:80 ${{ secrets.DOCKERHUB_USERNAME }}/simple-cicd:latest
          sleep 2
          docker ps
          curl http://localhost:8080
